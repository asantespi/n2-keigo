<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a3b5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N2 Keigo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>N2 Keigo SRS</title>
<style>
:root {
  --bg: #faf7f2; --card: #ffffff; --ink: #24211d; --muted: #7a726a; --line: #e6dfd5;
  --accent: #8a3b5a; --accent-ink: #ffffff; --good: #2f7d4f; --bad: #b3413a;
  --good-bg: #e3f3e8; --bad-bg: #f8e2df; --mark: #ffe58a; --new: #c2691b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17150f; --card: #221f18; --ink: #f1ece2; --muted: #a39a8c; --line: #383329;
    --accent: #d98aa8; --accent-ink: #2a1019; --good: #6fcf94; --bad: #f08c85;
    --good-bg: #1f3a29; --bad-bg: #40211f; --mark: #7a6420; --new: #f0a05a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  min-height: 100vh;
}
#app { max-width: 560px; margin: 0 auto; }
h1 { font-size: 22px; margin: 4px 0 2px; }
h2 { font-size: 17px; margin: 22px 0 8px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 12px 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.stat b { display: block; font-size: 26px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
button {
  font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 14px; padding: 14px 16px; width: 100%; cursor: pointer; margin: 6px 0; text-align: center;
}
button:active { transform: scale(.985); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; font-size: 18px; padding: 16px; }
button.good { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 600; }
button.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; }
.row > button { flex: 1; }
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.topbar .back { width: auto; padding: 8px 12px; margin: 0; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.count { font-size: 13px; color: var(--muted); min-width: 44px; text-align: right; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); }
.tag.new { color: var(--new); border-color: var(--new); }
.tag.retry { color: var(--bad); border-color: var(--bad); }
.pattern { font-size: 34px; font-weight: 700; line-height: 1.3; margin: 8px 0 4px; word-break: keep-all; overflow-wrap: anywhere; }
.pattern.sm { font-size: 26px; }
.sentence { font-size: 22px; line-height: 1.8; margin: 8px 0; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 2px; }
.val { font-size: 16px; }
.jp { font-size: 18px; }
.trans { color: var(--muted); font-size: 15px; }
.hr { height: 1px; background: var(--line); margin: 14px 0; }
.choice { text-align: left; font-size: 16px; }
.choice.right { background: var(--good-bg); border-color: var(--good); }
.choice.wrong { background: var(--bad-bg); border-color: var(--bad); }
textarea, input[type=number], input[type=text] {
  width: 100%; font: inherit; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink);
}
textarea { min-height: 96px; resize: vertical; }
textarea.mono { font: 12px/1.4 ui-monospace, Menlo, monospace; min-height: 160px; }
.msg { padding: 10px 12px; border-radius: 12px; margin: 10px 0; font-size: 14px; }
.msg.ok { background: var(--good-bg); color: var(--good); }
.msg.err { background: var(--bad-bg); color: var(--bad); white-space: pre-wrap; }
.list-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-item .p { font-weight: 600; }
.list-item .m { color: var(--muted); font-size: 13px; }
.lv { font-size: 12px; white-space: nowrap; color: var(--muted); }
.lv.mastered { color: var(--good); }
.big { font-size: 48px; text-align: center; margin: 10px 0; }
.center { text-align: center; }
.small { font-size: 13px; color: var(--muted); }

.situation { font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 6px 0 10px; }
.blank { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--accent); text-align: center; }
.sentence.wrongs { text-decoration: line-through; text-decoration-color: var(--bad); }
.kind { font-size: 12px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; }
.keigo { font-size: 32px; font-weight: 700; margin: 4px 0; }
.rt { color: var(--muted); font-size: 15px; }
.countdown { text-align: center; font-size: 14px; color: var(--muted); margin: 0 0 4px; }
.countdown b { color: var(--accent); font-size: 18px; }
.meter { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--good); }
.meter.low i { background: var(--bad); }
</style>
</head>
<body>
<div id="app"></div>

<script src="parse.js"></script>
<script src="keigo-seed.js"></script>
<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'n2keigo.v1';
const MIN = 60e3, H = 3600e3, D = 864e5;
// Wait after reaching level 0..8 (level 0 = after a miss)
const WAITS = [10 * MIN, 4 * H, 8 * H, 1 * D, 2 * D, 4 * D, 7 * D, 14 * D, 30 * D];
const MASTERED_LEVEL = 9, FOREVER = 9e15;
const PHASE_NAME = { flash: 'Flashcard', choice: 'Multiple choice', recall: 'Typed recall', quiz: 'Question' };
const KIND_NAME = { S: '尊敬語 · honorific', K: '謙譲語 · humble', T: '謙譲語II (丁重語) · humble, polite' };
const KIND_SHORT = { S: '尊敬語', K: '謙譲語', T: '丁重語' };
const MODE_NAME = { who: "Who's acting?", error: 'Error spotter', build: 'Pattern builder' };
const TAG_NAME = {
  who: "Scenarios: who's acting?", error: 'Error spotter', build: 'Pattern builder',
  'kind:S': '尊敬語 verb forms', 'kind:K': '謙譲語 verb forms', 'kind:T': '丁重語 verb forms',
};
const DEFAULT_EXAM = '2026-12-06';

/* ---------- state ---------- */
let state = load();
let screen = 'home';
let session = null;   // {queue, total, done, stats, step, practice}
let notice = null;
let browseFilter = '';

function today() { return new Date().toLocaleDateString('en-CA'); }
function baseState() { return { progress: {}, extra: [], settings: { dailyNew: 8, examDate: DEFAULT_EXAM }, intro: { date: '', count: 0 }, stats: {} }; }
function load() {
  const base = baseState();
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') return Object.assign(base, s, { settings: Object.assign(base.settings, s.settings) });
  } catch (e) {}
  return base;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- items ---------- */
function allItems() {
  const seen = new Set(), out = [];
  (window.SEED_KEIGO || []).concat(state.extra).forEach(it => {
    const k = String(it.id);
    if (seen.has(k)) return;
    seen.add(k);
    out.push(Object.assign({}, it, { key: k, order: out.length }));
  });
  return out;
}
function byKey() { const m = {}; allItems().forEach(i => m[i.key] = i); return m; }
function prog(key) { return state.progress[key]; }
function isDue(it, now) { const p = prog(it.key); return p && p.level < MASTERED_LEVEL && p.due <= now; }
function phaseFor(it, level) {
  if (it.type === 'quiz') return 'quiz';
  return level < 3 ? 'flash' : level < 6 ? 'choice' : 'recall';
}
function tagOf(it) { return it.type === 'quiz' ? it.mode : 'kind:' + it.kind; }

// NEW queue: deck order (core verb forms first, then questions mixed in). Reviews have no priority.
function newPool() { return allItems().filter(i => !prog(i.key)); }
function newQuotaLeft() {
  const used = state.intro.date === today() ? state.intro.count : 0;
  return Math.max(0, state.settings.dailyNew - used);
}
function dueItems(now) {
  return allItems().filter(i => isDue(i, now)).sort((a, b) => prog(a.key).due - prog(b.key).due);
}

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtWait(ms) {
  if (ms < MIN) return 'a moment';
  if (ms < H) return Math.round(ms / MIN) + ' min';
  if (ms < D) return Math.round(ms / H) + ' h';
  return Math.round(ms / D) + ' d';
}
function recordStat(it, correct) {
  const t = tagOf(it), s = state.stats[t] || (state.stats[t] = { r: 0, w: 0 });
  if (correct) s.r++; else s.w++;
}

// Highlight the keigo form inside a pair's example sentence (best effort: try the full form, then trim the ending).
function pairHighlight(it) {
  const s = it.sentence || '';
  if (!s || /[+/]/.test(it.keigo)) return null;
  const base = it.keigo.replace(/^V/, '').replace(/〜/g, '');
  for (let cut = 0; cut <= 2; cut++) {
    const t = base.slice(0, base.length - cut);
    if (t.length < 2) break;
    const i = s.indexOf(t);
    if (i >= 0) return [i, i + t.length];
  }
  return null;
}
function hlPair(it) {
  const r = pairHighlight(it), s = it.sentence || '';
  if (!r) return esc(s);
  return esc(s.slice(0, r[0])) + '<mark>' + esc(s.slice(r[0], r[1])) + '</mark>' + esc(s.slice(r[1]));
}
function fillBlank(it, text) { return esc(it.sentence).replace('＿＿', '<mark>' + esc(text) + '</mark>'); }

/* ---------- distractors for verb-form cards ---------- */
const fam = k => (k === 'S' ? 'S' : 'H');                 // K and T are both "humble"
const toks = v => String(v).split('・').map(x => x.trim());
function pairChoices(it) {
  const mine = toks(it.verb);
  const overlaps = o => toks(o.verb).some(t => mine.includes(t));
  const pool = allItems().filter(o => o.type === 'pair' && o.keigo !== it.keigo && !(fam(o.kind) === fam(it.kind) && overlaps(o)));
  const contrast = shuffle(pool.filter(o => overlaps(o) && fam(o.kind) !== fam(it.kind)));
  const sameFam = shuffle(pool.filter(o => !overlaps(o) && fam(o.kind) === fam(it.kind)));
  const rest = shuffle(pool.filter(o => !contrast.includes(o) && !sameFam.includes(o)));
  const out = [], seen = new Set([it.keigo]);
  contrast.slice(0, 2).concat(sameFam, rest).forEach(o => { if (out.length < 3 && !seen.has(o.keigo)) { seen.add(o.keigo); out.push(o.keigo); } });
  return shuffle([it.keigo].concat(out));
}

/* ---------- session persistence ---------- */
// The queue (incl. items to retry) is persisted so leaving mid-round never loses the pending cards.
const SESSION_KEY = KEY + '.session';
function saveSession() {
  if (!session || session.practice) return;
  try {
    if (session.queue.length) localStorage.setItem(SESSION_KEY, JSON.stringify({ queue: session.queue, total: session.total, done: session.done, stats: session.stats }));
    else localStorage.removeItem(SESSION_KEY);
  } catch (e) {}
}
function pendingSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (!s || !Array.isArray(s.queue)) return null;
    const m = byKey();
    s.queue = s.queue.filter(e => m[e.key]);
    return s.queue.length ? s : null;
  } catch (e) { return null; }
}
function resumeSession() {
  const s = pendingSession();
  if (!s) { screen = 'home'; return render(); }
  session = { queue: s.queue, total: s.total, done: s.done || 0, stats: s.stats || { right: 0, wrong: 0 }, step: null, practice: null };
  screen = 'session';
  render();
}

/* ---------- session ---------- */
function startSession() {
  const now = Date.now();
  const due = dueItems(now).map(i => ({ key: i.key, retry: false }));
  const fresh = newPool().slice(0, newQuotaLeft()).map(i => ({ key: i.key, retry: false }));
  const queue = due.concat(fresh);
  if (!queue.length) return;
  session = { queue, total: queue.length, done: 0, stats: { right: 0, wrong: 0 }, step: null, practice: null };
  saveSession();
  screen = 'session';
  render();
}
function startPractice(mode) {
  let pool = allItems().filter(i => mode === 'forms' ? i.type === 'pair' : i.type === 'quiz' && (mode === 'all' || i.mode === mode));
  if (mode === 'forms' && pool.length < 4) return;
  pool = shuffle(pool).slice(0, 10);
  if (!pool.length) return;
  session = { queue: pool.map(i => ({ key: i.key, retry: false })), total: pool.length, done: 0, stats: { right: 0, wrong: 0 }, step: null, practice: mode };
  screen = 'session';
  render();
}
function currentEntry() { return session.queue[0]; }
function applyAnswer(entry, correct) {
  if (entry.retry) return;
  const it = byKey()[entry.key];
  if (it) recordStat(it, correct);
  if (correct) session.stats.right++; else session.stats.wrong++;
  if (session.practice) { save(); return; }
  const now = Date.now();
  let p = state.progress[entry.key];
  if (!p) {
    p = state.progress[entry.key] = { level: 0, due: now };
    if (state.intro.date !== today()) state.intro = { date: today(), count: 0 };
    state.intro.count++;
  }
  p.level = correct ? p.level + 1 : Math.max(0, p.level - 1);
  p.due = p.level >= MASTERED_LEVEL ? FOREVER : now + WAITS[p.level];
  p.last = now;
  save();
}
function finishEntry(correct) {
  const entry = session.queue.shift();
  if (!correct) session.queue.push({ key: entry.key, retry: true });
  else session.done++;
  session.step = null;
  saveSession();
  if (!session.queue.length) screen = 'complete';
  render();
}
function answer(correct) { applyAnswer(currentEntry(), correct); finishEntry(correct); }

/* ---------- views ---------- */
function pairDetail(it, opts) {
  opts = opts || {};
  return (opts.verb ? '<div class="label">Plain form</div><div class="val jp">' + esc(it.verb) + ' <span class="small">(' + esc(it.meaning) + ')</span></div>' : '') +
    '<div class="label">' + esc(KIND_NAME[it.kind]) + '</div><div class="keigo">' + esc(it.keigo) + '</div>' +
    (it.reading && it.reading !== it.keigo ? '<div class="rt">' + esc(it.reading) + '</div>' : '') +
    (it.notes ? '<div class="label">Watch out</div><div class="val">' + esc(it.notes) + '</div>' : '') +
    (it.sentence ? '<div class="hr"></div><div class="sentence">' + hlPair(it) + '</div>' + (it.translation ? '<div class="trans">' + esc(it.translation) + '</div>' : '') : '');
}
function tagsFor(it, entry, phase, lv) {
  const label = it.type === 'quiz' ? MODE_NAME[it.mode] : KIND_SHORT[it.kind];
  return '<div class="tags"><span class="tag">' + esc(label) + '</span>' +
    '<span class="tag">' + PHASE_NAME[phase] + '</span>' +
    (session.practice ? '<span class="tag">Practice</span>' : lv == null ? '<span class="tag new">NEW</span>' : '<span class="tag">Lv ' + lv + '</span>') +
    (entry.retry ? '<span class="tag retry">Retry</span>' : '') + '</div>';
}

function examCountdown() {
  const d = state.settings.examDate;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return '';
  const days = Math.ceil((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / D);
  if (days < 0) return '';
  return '<p class="countdown"><b>' + days + '</b> day' + (days === 1 ? '' : 's') + ' until the JLPT (' + esc(d) + ')</p>';
}

function viewHome() {
  const now = Date.now();
  const items = allItems();
  const due = dueItems(now).length;
  const pool = newPool();
  const fresh = Math.min(newQuotaLeft(), pool.length);
  const mastered = items.filter(i => prog(i.key) && prog(i.key).level >= MASTERED_LEVEL).length;
  const learning = items.filter(i => prog(i.key) && prog(i.key).level < MASTERED_LEVEL).length;
  const upcoming = items.filter(i => prog(i.key) && prog(i.key).level < MASTERED_LEVEL && prog(i.key).due > now)
    .map(i => prog(i.key).due).sort((a, b) => a - b)[0];
  let html = '<h1>N2 Keigo</h1><p class="sub">' + items.length + ' items · ' + learning + ' learning · ' + mastered + ' mastered</p>' + examCountdown();
  if (notice) { html += '<div class="msg ' + notice.kind + '">' + esc(notice.text) + '</div>'; notice = null; }
  html += '<div class="stats"><div class="stat"><b>' + due + '</b><span>Due reviews</span></div>' +
    '<div class="stat"><b>' + fresh + '</b><span>New today</span></div>' +
    '<div class="stat"><b>' + mastered + '</b><span>Mastered</span></div></div>';
  const pend = pendingSession();
  if (pend) html += '<button class="primary" data-act="resume">Resume session (' + pend.queue.length + ' left)</button>';
  html += '<button' + (pend ? '' : ' class="primary"') + ' data-act="start"' + (due + fresh ? '' : ' disabled') + '>' + (due + fresh ? 'Start (' + (due + fresh) + ')' : 'Nothing to do right now') + '</button>';
  if (!due && !fresh) {
    if (upcoming) html += '<p class="small center">Next review in ' + fmtWait(upcoming - now) + '</p>';
    else if (!pool.length) html += '<p class="small center">No new items left. Add more!</p>';
    else html += '<p class="small center">Daily new limit reached (' + state.settings.dailyNew + '/day).</p>';
  }
  html += '<button data-act="go" data-to="practice">Practice (free drill)</button>';
  html += '<div class="row" style="margin-top:18px"><button data-act="go" data-to="progress">Progress</button><button data-act="go" data-to="browse">Browse</button></div>' +
    '<div class="row"><button data-act="go" data-to="add">Add</button><button data-act="go" data-to="settings">Settings</button></div>';
  return html;
}

function viewPractice() {
  const items = allItems();
  const n = m => items.filter(i => i.type === 'quiz' && i.mode === m).length;
  const forms = items.filter(i => i.type === 'pair').length;
  const row = (mode, title, desc, count) => '<button data-act="practice" data-mode="' + mode + '"' + (count ? '' : ' disabled') + '><b>' + title + '</b><br><span class="small">' + desc + ' · ' + count + ' available</span></button>';
  return '<div class="topbar"><button class="back" data-act="home">←</button><h1 style="margin:0">Practice</h1></div>' +
    '<p class="sub">10 random questions. Does not change your SRS levels, but feeds the Progress screen.</p>' +
    row('who', "Who's acting?", 'Choose the right keigo for the situation', n('who')) +
    row('error', 'Error spotter', 'Find the fix for a wrong sentence', n('error')) +
    row('build', 'Pattern builder', 'Turn a plain verb into keigo', n('build')) +
    row('forms', 'Verb forms', 'Plain verb to keigo form (multiple choice)', forms >= 4 ? forms : 0) +
    row('all', 'Mixed questions', 'All three question types together', n('who') + n('error') + n('build'));
}

function viewSession() {
  const entry = currentEntry(), it = byKey()[entry.key];
  if (!it) { session.queue.shift(); if (!session.queue.length) { screen = 'complete'; return viewComplete(); } return viewSession(); }
  const p = prog(it.key), level = p ? p.level : 0;
  const st = session.step || (session.step = {});
  if (!st.phase) {
    st.lv = p ? p.level : null;
    let ph = phaseFor(it, level);
    if (it.type === 'pair' && session.practice) ph = 'choice';
    if (ph === 'choice' && allItems().filter(o => o.type === 'pair').length < 4) ph = 'flash';
    st.phase = ph;
  }
  const phase = st.phase;
  const pct = Math.round(100 * session.done / session.total);
  let html = '<div class="topbar"><button class="back" data-act="quit">✕</button><div class="bar"><i style="width:' + pct + '%"></i></div><div class="count">' + session.done + '/' + session.total + '</div></div>';
  html += '<div class="card">' + tagsFor(it, entry, phase, st.lv);

  if (phase === 'quiz') {
    if (!st.options) { st.options = shuffle([it.answer].concat(it.wrong)); st.correct = it.answer; }
    if (it.situation) html += '<div class="situation">' + esc(it.situation) + '</div>';
    if (it.mode === 'error') {
      html += '<div class="small">This sentence is wrong. Which is the correct version?</div><div class="sentence wrongs">' + esc(it.sentence) + '</div></div>';
    } else {
      const q = esc(it.sentence).replace('＿＿', '<span class="blank">　？　</span>');
      html += '<div class="small">' + (it.mode === 'who' ? 'Which keigo fits the blank?' : 'Fill the blank.') + '</div><div class="sentence">' + q + '</div></div>';
    }
    st.options.forEach((o, i) => {
      let cls = 'choice';
      if (st.picked != null) { if (o === st.correct) cls += ' right'; else if (i === st.picked) cls += ' wrong'; }
      html += '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (st.picked != null ? ' disabled' : '') + '>' + esc(o) + '</button>';
    });
    if (st.picked != null) {
      html += '<div class="card">' + (st.ok ? '<div class="val" style="color:var(--good);font-weight:600">Correct</div>' : '<div class="val" style="color:var(--bad);font-weight:600">Not quite</div>') +
        '<div class="sentence">' + (it.mode === 'error' ? esc(it.answer) : fillBlank(it, it.answer)) + '</div>' +
        (it.why ? '<div class="label">Why</div><div class="val">' + esc(it.why) + '</div>' : '') + '</div>' +
        '<button class="primary" data-act="next">Next</button>';
    }
  } else if (phase === 'flash') {
    html += '<div class="label">Plain form · ' + esc(KIND_NAME[it.kind]) + '</div><div class="pattern sm">' + esc(it.verb) + '</div><div class="trans">' + esc(it.meaning) + '</div>';
    if (!st.revealed) {
      html += '</div><button class="primary" data-act="reveal">Show answer</button>';
    } else {
      html += '<div class="hr"></div>' + pairDetail(it) + '</div><div class="row"><button class="bad" data-act="miss">Missed it</button><button class="good" data-act="hit">Got it</button></div>';
    }
  } else if (phase === 'choice') {
    if (!st.options) { st.options = pairChoices(it); st.correct = it.keigo; }
    html += '<div class="label">Plain form</div><div class="pattern sm">' + esc(it.verb) + '</div><div class="trans">' + esc(it.meaning) + '</div>' +
      '<div class="small" style="margin-top:8px">Pick the <b>' + esc(KIND_NAME[it.kind]) + '</b> form.</div></div>';
    st.options.forEach((o, i) => {
      let cls = 'choice';
      if (st.picked != null) { if (o === st.correct) cls += ' right'; else if (i === st.picked) cls += ' wrong'; }
      html += '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (st.picked != null ? ' disabled' : '') + '>' + esc(o) + '</button>';
    });
    if (st.picked != null) html += '<div class="card">' + pairDetail(it) + '</div><button class="primary" data-act="next">Next</button>';
  } else {
    html += '<div class="label">Plain form · ' + esc(KIND_NAME[it.kind]) + '</div><div class="pattern sm">' + esc(it.verb) + '</div><div class="trans">' + esc(it.meaning) + '</div></div>';
    if (!st.revealed) {
      html += '<textarea id="typed" placeholder="Type the keigo form…"></textarea><button class="primary" data-act="reveal">Reveal</button>';
    } else {
      html += '<div class="card"><div class="label">You wrote</div><div class="val">' + (esc(st.typed) || '<span class="small">(nothing)</span>') + '</div><div class="hr"></div>' +
        pairDetail(it) + '</div><div class="row"><button class="bad" data-act="miss">Missed it</button><button class="good" data-act="hit">Got it</button></div>';
    }
  }
  return html;
}

function viewComplete() {
  const s = session.stats, total = s.right + s.wrong;
  const due = dueItems(Date.now()).length;
  return '<div class="big">🎉</div><h1 class="center">' + (session.practice ? 'Practice complete' : 'Session complete') + '</h1>' +
    '<p class="sub center">' + s.right + ' correct · ' + s.wrong + ' missed' + (total ? ' · ' + Math.round(100 * s.right / total) + '%' : '') + '</p>' +
    (due && !session.practice ? '<p class="small center">' + due + ' more review' + (due > 1 ? 's' : '') + ' already due.</p>' : '') +
    '<button class="primary" data-act="home">Done</button>';
}

function viewProgress() {
  const tags = Object.keys(TAG_NAME);
  const rows = tags.map(t => { const s = state.stats[t] || { r: 0, w: 0 }; return { t, n: s.r + s.w, pct: s.r + s.w ? Math.round(100 * s.r / (s.r + s.w)) : null }; });
  const weak = rows.filter(r => r.n >= 3).sort((a, b) => a.pct - b.pct)[0];
  const items = allItems();
  const total = items.length, seen = items.filter(i => prog(i.key)).length;
  const mastered = items.filter(i => prog(i.key) && prog(i.key).level >= MASTERED_LEVEL).length;
  let html = '<div class="topbar"><button class="back" data-act="home">←</button><h1 style="margin:0">Progress</h1></div>' + examCountdown() +
    '<div class="stats"><div class="stat"><b>' + seen + '/' + total + '</b><span>Started</span></div><div class="stat"><b>' + mastered + '</b><span>Mastered</span></div>' +
    '<div class="stat"><b>' + rows.reduce((a, r) => a + r.n, 0) + '</b><span>Answers</span></div></div>';
  if (weak && weak.pct < 80) html += '<div class="msg err">Weakest area: ' + esc(TAG_NAME[weak.t]) + ' (' + weak.pct + '%). Try a Practice round on it.</div>';
  html += '<h2>Accuracy by area</h2><div class="card">';
  rows.forEach(r => {
    html += '<div style="margin:10px 0"><div class="list-item" style="border:0;padding:0"><span>' + esc(TAG_NAME[r.t]) + '</span><span class="lv">' +
      (r.n ? r.pct + '% · ' + r.n : 'no data') + '</span></div><div class="meter' + (r.n >= 3 && r.pct < 70 ? ' low' : '') + '"><i style="width:' + (r.pct || 0) + '%"></i></div></div>';
  });
  html += '</div><p class="small">Counts first attempts only (retries after a miss are not counted).</p>';
  return html;
}

function levelLabel(it) {
  const p = prog(it.key);
  if (!p) return '<span class="lv">New</span>';
  if (p.level >= MASTERED_LEVEL) return '<span class="lv mastered">Mastered</span>';
  return '<span class="lv">Lv ' + p.level + '</span>';
}
function viewBrowse() {
  const q = browseFilter.trim().toLowerCase();
  const items = allItems().filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  const pairs = items.filter(i => i.type === 'pair'), quizzes = items.filter(i => i.type === 'quiz');
  let html = '<div class="topbar"><button class="back" data-act="home">←</button><h1 style="margin:0">Browse</h1></div>' +
    '<input type="text" id="filter" placeholder="Search…" value="' + esc(browseFilter) + '">';
  if (pairs.length) {
    html += '<h2>Verb forms</h2>';
    pairs.forEach(i => {
      html += '<div class="list-item"><div><div class="p">' + esc(i.keigo) + ' <span class="kind">' + esc(KIND_SHORT[i.kind]) + '</span></div><div class="m">' + esc(i.verb) + ' · ' + esc(i.meaning) + '</div></div>' + levelLabel(i) + '</div>';
    });
  }
  if (quizzes.length) {
    html += '<h2>Questions</h2>';
    quizzes.forEach(i => {
      html += '<div class="list-item"><div><div class="p">' + esc(i.mode === 'error' ? i.sentence : i.sentence.replace('＿＿', '（' + i.answer + '）')) + '</div><div class="m">' + esc(MODE_NAME[i.mode]) + '</div></div>' + levelLabel(i) + '</div>';
    });
  }
  if (!items.length) html += '<p class="small">No matches.</p>';
  return html;
}

const ADD_HINT = 'Verb: 渡す\nMeaning: to hand over\nKind: K\nKeigo: お渡しする\nReading: おわたしする\nNotes: お + V-stem + する\nSentence: 資料をお渡しします。\nTranslation: I will hand you the documents.\n---\nMode: who\nSituation: You are speaking to a client.\nSentence: こちらでお＿＿ください。\nAnswer: 待ち\nWrong: 待ちして | 待ちになって | 待たれて\nWhy: お + V-stem + ください\n---\n…';
function viewAdd() {
  let html = '<div class="topbar"><button class="back" data-act="home">←</button><h1 style="margin:0">Add cards</h1></div>' +
    '<p class="sub">One card per block, separated by a line of <code>---</code>.<br><b>Verb form:</b> Verb, Meaning, Kind (S = 尊敬語, K = 謙譲語, T = 丁重語), Keigo; optional Reading, Notes, Sentence, Translation.<br><b>Question:</b> Mode (who / error / build), Sentence (use ＿＿ for the blank), Answer, Wrong (3 choices separated by |); optional Situation, Why. New cards go to the end of the queue.</p>';
  if (notice) { html += '<div class="msg ' + notice.kind + '">' + esc(notice.text) + '</div>'; notice = null; }
  html += '<textarea class="mono" id="addText" placeholder="' + esc(ADD_HINT) + '"></textarea><button class="primary" data-act="import-cards">Add</button>';
  return html;
}

function viewSettings() {
  let html = '<div class="topbar"><button class="back" data-act="home">←</button><h1 style="margin:0">Settings</h1></div>';
  if (notice) { html += '<div class="msg ' + notice.kind + '">' + esc(notice.text) + '</div>'; notice = null; }
  html += '<div class="card"><div class="label">New items per day</div><input type="number" id="dailyNew" min="0" max="50" value="' + state.settings.dailyNew + '">' +
    '<div class="label">Exam date (YYYY-MM-DD)</div><input type="text" id="examDate" value="' + esc(state.settings.examDate) + '" placeholder="2026-12-06">' +
    '<button data-act="save-settings">Save</button><p class="small">Due reviews always show on top of the daily limit. The default exam date is a guess (first Sunday of December); set yours.</p></div>' +
    '<h2>Backup</h2><div class="card"><p class="small" style="margin-top:0">Copy this to keep a backup or move to another device, then paste it back here and tap Import.</p>' +
    '<textarea class="mono" id="backup">' + esc(JSON.stringify(state)) + '</textarea>' +
    '<div class="row"><button data-act="copy-backup">Copy</button><button data-act="import-backup">Import</button></div></div>' +
    '<h2>Danger zone</h2><button class="bad" data-act="reset">Reset all progress</button>';
  return html;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = { home: viewHome, session: viewSession, complete: viewComplete, practice: viewPractice, progress: viewProgress, browse: viewBrowse, add: viewAdd, settings: viewSettings }[screen]();
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'start') { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} return startSession(); }
  if (act === 'resume') return resumeSession();
  if (act === 'practice') return startPractice(el.dataset.mode);
  if (act === 'go') { screen = el.dataset.to; return render(); }
  if (act === 'home') { screen = 'home'; session = null; return render(); }
  if (act === 'quit') { if (!session || confirm('Leave this session? You can resume it from the home screen.')) { screen = 'home'; session = null; render(); } return; }
  if (act === 'reveal') {
    const t = document.getElementById('typed');
    if (t) session.step.typed = t.value;
    session.step.revealed = true; return render();
  }
  if (act === 'hit') return answer(true);
  if (act === 'miss') return answer(false);
  if (act === 'pick') {
    const st = session.step, i = +el.dataset.i;
    if (st.picked != null) return;
    st.picked = i; st.ok = st.options[i] === st.correct;
    applyAnswer(currentEntry(), st.ok);
    return render();
  }
  if (act === 'next') return finishEntry(session.step.ok);
  if (act === 'save-settings') {
    const n = Math.max(0, Math.min(50, parseInt(document.getElementById('dailyNew').value, 10) || 0));
    state.settings.dailyNew = n;
    state.settings.examDate = document.getElementById('examDate').value.trim();
    save(); notice = { kind: 'ok', text: 'Saved.' }; return render();
  }
  if (act === 'copy-backup') {
    const t = document.getElementById('backup'); t.select();
    try { navigator.clipboard.writeText(t.value); notice = { kind: 'ok', text: 'Copied.' }; } catch (err) { document.execCommand('copy'); }
    return;
  }
  if (act === 'import-backup') {
    try {
      const s = JSON.parse(document.getElementById('backup').value);
      if (!s || typeof s.progress !== 'object') throw new Error('bad');
      if (!confirm('Replace current progress with this backup?')) return;
      state = Object.assign(baseState(), s, { settings: Object.assign(baseState().settings, s.settings) });
      save(); notice = { kind: 'ok', text: 'Backup imported.' };
    } catch (err) { notice = { kind: 'err', text: 'That is not a valid backup.' }; }
    return render();
  }
  if (act === 'reset') {
    if (confirm('Erase ALL progress? This cannot be undone.') && confirm('Really erase everything?')) {
      state.progress = {}; try { localStorage.removeItem(SESSION_KEY); } catch (e) {} state.stats = {}; state.intro = { date: '', count: 0 }; save(); notice = { kind: 'ok', text: 'Progress reset.' }; render();
    }
    return;
  }
  if (act === 'import-cards') {
    const res = parseKeigo(document.getElementById('addText').value);
    const known = new Set(allItems().map(i => i.key));
    let added = 0, dup = 0;
    res.items.forEach(it => { if (known.has(String(it.id))) dup++; else { state.extra.push(it); known.add(String(it.id)); added++; } });
    save();
    const parts = [added + ' added'];
    if (dup) parts.push(dup + ' skipped (duplicate)');
    if (res.errors.length) parts.push('\n' + res.errors.join('\n'));
    notice = { kind: res.errors.length && !added ? 'err' : 'ok', text: parts.join(', ').replace(', \n', '\n') };
    return render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'filter') {
    browseFilter = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const f = document.getElementById('filter'); f.focus(); f.setSelectionRange(pos, pos);
  }
});

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
